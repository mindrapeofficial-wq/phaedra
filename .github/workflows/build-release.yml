name: Build and Release Phaedra

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-gtk2
            mingw-w64-ucrt-x86_64-libsndfile
            mingw-w64-ucrt-x86_64-libsamplerate
            mingw-w64-ucrt-x86_64-fftw
            mingw-w64-ucrt-x86_64-aubio
            mingw-w64-ucrt-x86_64-liblo
            mingw-w64-ucrt-x86_64-taglib
            mingw-w64-ucrt-x86_64-libusb
            mingw-w64-ucrt-x86_64-lv2
            mingw-w64-ucrt-x86_64-serd
            mingw-w64-ucrt-x86_64-sord
            mingw-w64-ucrt-x86_64-sratom
            mingw-w64-ucrt-x86_64-lilv
            mingw-w64-ucrt-x86_64-rubberband
            mingw-w64-ucrt-x86_64-vamp-plugin-sdk
            mingw-w64-ucrt-x86_64-libarchive
            mingw-w64-ucrt-x86_64-portaudio
            mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-pango
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-glibmm
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-libxml2
            mingw-w64-ucrt-x86_64-flac
            mingw-w64-ucrt-x86_64-libogg
            mingw-w64-ucrt-x86_64-libvorbis
            mingw-w64-ucrt-x86_64-cppunit
            mingw-w64-ucrt-x86_64-readline
            base-devel
            zip
            python

      - name: Configure
        run: |
          python waf configure \
            --with-backends=portaudio,dummy \
            --no-phone-home \
            --dist-target=mingw \
            --optimize \
            --program-name=Phaedra

      - name: Build
        run: python waf build -j4

      - name: Package Portable
        run: bash make_portable.sh

      - name: Update version in portable
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$VERSION" > Phaedra-Portable/version.txt

      - name: Create ZIP
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd Phaedra-Portable && zip -r "../Phaedra-v${VERSION}.zip" . && cd ..

      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $iscc = Get-ChildItem -Path ${env:ProgramFiles(x86)} -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw 'ISCC.exe not found' }
          & $iscc "/DAppVersion=$version" Phaedra.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Phaedra-v*.zip
            Phaedra-Instalador-Windows-x64.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
