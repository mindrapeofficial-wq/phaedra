name: Verify Phaedra Free Plugin Suite

on:
  pull_request:
    paths:
      - 'tools/install_free_plugins.ps1'
      - 'tools/phaedra-plugin-replacements.json'
      - '.github/workflows/verify-plugin-suite.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-free-plugins:
    name: Check downloaded VST3 bundles (${{ matrix.group }})
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [Effects, Sampler]
    steps:
      - name: Checkout Phaedra source
        uses: actions/checkout@v4

      - name: Download, hash-check, extract and install free plugins
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "Phaedra-Test/Plugins/VST3"
          & ./tools/install_free_plugins.ps1 -ManifestPath ./tools/phaedra-plugin-replacements.json -Destination $destination -Group "${{ matrix.group }}"
          if (-not $?) { throw "El instalador PowerShell termino con error." }
          $bundles = @(Get-ChildItem -Path $destination -Filter '*.vst3')
          if ($bundles.Count -eq 0) { throw 'No VST3 bundles were installed' }
          Write-Host ('Bundles: ' + ($bundles.Name -join ', '))
