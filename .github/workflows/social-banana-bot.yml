name: Social Banana Bot
on:
  push:
    branches: [main]
    paths: ['tools/telegram-bot/**', '.claude/skills/ig-*/**', '.github/workflows/social-banana-bot.yml']
  pull_request:
    paths: ['tools/telegram-bot/**', '.claude/skills/ig-*/**', '.github/workflows/social-banana-bot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        working-directory: tools/telegram-bot
        run: npm ci
      - name: Test isolation, images, onboarding, Drive and webhook signatures
        working-directory: tools/telegram-bot
        run: npm test
