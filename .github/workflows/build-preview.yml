name: Build Phaedra Windows preview

on:
  workflow_dispatch:
  push:
    branches:
      - fix/prisma-packaging-v1013-20261027

permissions:
  contents: write

jobs:
  package-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test package preflight and missing-file rejection
        shell: bash
        run: |
          set -euo pipefail
          bash -n make_portable.sh
          bash -n tools/check_prisma_payload.sh
          root="$(mktemp -d)"
          if bash tools/check_prisma_payload.sh "$root"; then
            echo "The missing Prisma payload should have been rejected." >&2
            exit 1
          fi
          mkdir -p "$root/Prisma.vst3/Contents/x86_64-win"
          mkdir -p "$root/SurgeXTData/skins/prisma.surge-skin"
          printf 'binary-test' > "$root/Prisma.vst3/Contents/x86_64-win/Prisma.vst3"
          printf '<skin />' > "$root/SurgeXTData/skins/prisma.surge-skin/skin.xml"
          printf 'license-test' > "$root/LICENSE-Surge-XT.txt"
          bash tools/check_prisma_payload.sh "$root"

  build:
    needs: package-contract
    # Pin MSVC 2022 while validating Phaedra/Surge compatibility.
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-gtk2
            mingw-w64-ucrt-x86_64-libsndfile
            mingw-w64-ucrt-x86_64-libsamplerate
            mingw-w64-ucrt-x86_64-fftw
            mingw-w64-ucrt-x86_64-aubio
            mingw-w64-ucrt-x86_64-liblo
            mingw-w64-ucrt-x86_64-taglib
            mingw-w64-ucrt-x86_64-libusb
            mingw-w64-ucrt-x86_64-lv2
            mingw-w64-ucrt-x86_64-serd
            mingw-w64-ucrt-x86_64-sord
            mingw-w64-ucrt-x86_64-sratom
            mingw-w64-ucrt-x86_64-lilv
            mingw-w64-ucrt-x86_64-rubberband
            mingw-w64-ucrt-x86_64-vamp-plugin-sdk
            mingw-w64-ucrt-x86_64-libarchive
            mingw-w64-ucrt-x86_64-portaudio
            mingw-w64-ucrt-x86_64-jack2
            mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-cairomm
            mingw-w64-ucrt-x86_64-pangomm
            mingw-w64-ucrt-x86_64-pango
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-glibmm
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-libxml2
            mingw-w64-ucrt-x86_64-flac
            mingw-w64-ucrt-x86_64-libogg
            mingw-w64-ucrt-x86_64-libvorbis
            mingw-w64-ucrt-x86_64-cppunit
            mingw-w64-ucrt-x86_64-readline
            git
            base-devel
            zip
            python

      - name: Build Prisma VST3 from pinned Surge XT source
        shell: pwsh
        run: ./tools/build_prisma_windows.ps1

      - name: Verify Prisma bundle before compiling Phaedra
        run: bash tools/check_prisma_payload.sh vendor/prisma

      - name: Configure
        run: |
          python waf configure \
            --with-backends=portaudio,dummy \
            --no-phone-home \
            --no-dr-mingw \
            --dist-target=mingw \
            --optimize \
            --program-name=Phaedra

      - name: Build
        run: python waf build -j4

      - name: Package Portable
        run: bash make_portable.sh

      - name: Update version in portable
        run: |
          VERSION="$(tr -d '\r\n' < phaedra_updater/version.txt)"
          echo "$VERSION" > Phaedra-Portable/version.txt

      - name: Create ZIP
        run: |
          VERSION="$(tr -d '\r\n' < phaedra_updater/version.txt)"
          cd Phaedra-Portable && zip -r "../Phaedra-v${VERSION}.zip" . && cd ..

      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content -Raw phaedra_updater/version.txt).Trim()
          $iscc = Get-ChildItem -Path ${env:ProgramFiles(x86)} -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw 'ISCC.exe not found' }
          & $iscc "/DAppVersion=$version" Phaedra.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phaedra-windows-preview
          path: |
            Phaedra-v*.zip
            Phaedra-Instalador-Windows-x64.exe
          retention-days: 2

  installer-smoke:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Download the exact ZIP and installer built in this run
        uses: actions/download-artifact@v4
        with:
          name: phaedra-windows-preview
          path: preview-artifacts

      - name: Verify artifacts and required Portable payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Join-Path $PWD 'preview-artifacts\Phaedra-v1.0.13.zip'
          $installer = Join-Path $PWD 'preview-artifacts\Phaedra-Instalador-Windows-x64.exe'
          foreach ($path in @($zip, $installer)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or (Get-Item -LiteralPath $path).Length -lt 1MB) {
              throw "Artifact missing or implausibly small: $path"
            }
            Write-Host "$path $((Get-Item -LiteralPath $path).Length) bytes SHA256=$((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash)"
          }
          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $required = @(
              'version.txt',
              'COPYING',
              'Phaedra.exe',
              'bin/Phaedra.exe',
              'lib/phaedra8/vst3/Prisma.vst3/Contents/x86_64-win/Prisma.vst3',
              'lib/phaedra8/vst3/SurgeXTData/skins/prisma.surge-skin/skin.xml',
              'lib/phaedra8/vst3/LICENSE-Surge-XT.txt',
              'lib/phaedra8/vst3/PRISMA-SOURCE.txt'
            )
            foreach ($name in $required) {
              $entry = $archive.GetEntry($name)
              if ($null -eq $entry -or $entry.Length -eq 0) { throw "Missing/empty ZIP entry: $name" }
              Write-Host "ZIP payload OK: $name ($($entry.Length) bytes)"
            }
            $reader = [IO.StreamReader]::new($archive.GetEntry('version.txt').Open())
            try { $version = $reader.ReadToEnd().Trim() } finally { $reader.Dispose() }
            if ($version -ne '1.0.13') { throw "Wrong version in ZIP: $version" }
            Write-Host "ZIP contains $($archive.Entries.Count) entries."
          }
          finally { $archive.Dispose() }

      - name: Silent install and compare installed payload with Portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $installer = Join-Path $PWD 'preview-artifacts\Phaedra-Instalador-Windows-x64.exe'
          $zip = Join-Path $PWD 'preview-artifacts\Phaedra-v1.0.13.zip'
          $install = Join-Path $env:RUNNER_TEMP 'Phaedra-v1.0.13-smoke'
          $log = Join-Path $env:RUNNER_TEMP 'phaedra-install.log'
          $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$install", "/LOG=$log")
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 80 }
            throw "Inno Setup silent installation failed (exit $($process.ExitCode))."
          }
          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $checked = 0
            foreach ($entry in $archive.Entries) {
              if ($entry.FullName.EndsWith('/')) { continue }
              $installed = Join-Path $install ($entry.FullName.Replace('/', '\'))
              if (-not (Test-Path -LiteralPath $installed -PathType Leaf)) {
                throw "Installer omitted Portable file: $($entry.FullName)"
              }
              if ((Get-Item -LiteralPath $installed).Length -ne $entry.Length) {
                throw "Installer file size differs from ZIP: $($entry.FullName)"
              }
              $checked++
            }
            Write-Host "Installed all $checked ZIP files with matching sizes."
            $sha = [Security.Cryptography.SHA256]::Create()
            try {
              foreach ($name in @(
                'Phaedra.exe',
                'bin/Phaedra.exe',
                'lib/phaedra8/vst3/Prisma.vst3/Contents/x86_64-win/Prisma.vst3',
                'lib/phaedra8/vst3/SurgeXTData/skins/prisma.surge-skin/skin.xml',
                'lib/phaedra8/vst3/LICENSE-Surge-XT.txt'
              )) {
                $stream = $archive.GetEntry($name).Open()
                try { $expected = [Convert]::ToHexString($sha.ComputeHash($stream)) } finally { $stream.Dispose() }
                $actual = (Get-FileHash -LiteralPath (Join-Path $install ($name.Replace('/', '\'))) -Algorithm SHA256).Hash
                if ($expected -ne $actual) { throw "Installed file hash differs from Portable ZIP: $name" }
                Write-Host "Installer SHA256 matches ZIP: $name"
              }
            }
            finally { $sha.Dispose() }
            if ((Get-Content -LiteralPath (Join-Path $install 'version.txt') -Raw).Trim() -ne '1.0.13') {
              throw 'Installed version is not 1.0.13'
            }
          }
          finally { $archive.Dispose() }
          if (-not (Get-ChildItem -LiteralPath $install -Filter 'unins*.exe' -File)) {
            throw 'Inno Setup uninstaller not found'
          }

      - name: Silent uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $install = Join-Path $env:RUNNER_TEMP 'Phaedra-v1.0.13-smoke'
          $uninstaller = Get-ChildItem -LiteralPath $install -Filter 'unins*.exe' -File | Select-Object -First 1
          if (-not $uninstaller) { throw 'Inno Setup uninstaller missing' }
          $process = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstall failed (exit $($process.ExitCode))." }
          if (Test-Path -LiteralPath (Join-Path $install 'bin\Phaedra.exe')) {
            throw 'Phaedra binary remains after uninstall'
          }
          Write-Host 'Install + complete payload audit + uninstall passed (GUI startup not tested).'
