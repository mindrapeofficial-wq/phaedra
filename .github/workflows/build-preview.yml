name: Build Phaedra Windows preview

on:
  workflow_dispatch:
  push:
    branches:
      - fix/prisma-packaging-v1013-20261027

permissions:
  contents: write

jobs:
  package-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test package preflight and missing-file rejection
        shell: bash
        run: |
          set -euo pipefail
          bash -n make_portable.sh
          bash -n tools/check_prisma_payload.sh
          root="$(mktemp -d)"
          if bash tools/check_prisma_payload.sh "$root"; then
            echo "The missing Prisma payload should have been rejected." >&2
            exit 1
          fi
          mkdir -p "$root/Prisma.vst3/Contents/x86_64-win"
          mkdir -p "$root/SurgeXTData/skins/prisma.surge-skin"
          printf 'binary-test' > "$root/Prisma.vst3/Contents/x86_64-win/Prisma.vst3"
          printf '<skin />' > "$root/SurgeXTData/skins/prisma.surge-skin/skin.xml"
          printf 'license-test' > "$root/LICENSE-Surge-XT.txt"
          bash tools/check_prisma_payload.sh "$root"

  build:
    needs: package-contract
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-gtk2
            mingw-w64-ucrt-x86_64-libsndfile
            mingw-w64-ucrt-x86_64-libsamplerate
            mingw-w64-ucrt-x86_64-fftw
            mingw-w64-ucrt-x86_64-aubio
            mingw-w64-ucrt-x86_64-liblo
            mingw-w64-ucrt-x86_64-taglib
            mingw-w64-ucrt-x86_64-libusb
            mingw-w64-ucrt-x86_64-lv2
            mingw-w64-ucrt-x86_64-serd
            mingw-w64-ucrt-x86_64-sord
            mingw-w64-ucrt-x86_64-sratom
            mingw-w64-ucrt-x86_64-lilv
            mingw-w64-ucrt-x86_64-rubberband
            mingw-w64-ucrt-x86_64-vamp-plugin-sdk
            mingw-w64-ucrt-x86_64-libarchive
            mingw-w64-ucrt-x86_64-portaudio
            mingw-w64-ucrt-x86_64-jack2
            mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-cairomm
            mingw-w64-ucrt-x86_64-pangomm
            mingw-w64-ucrt-x86_64-pango
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-glibmm
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-libxml2
            mingw-w64-ucrt-x86_64-flac
            mingw-w64-ucrt-x86_64-libogg
            mingw-w64-ucrt-x86_64-libvorbis
            mingw-w64-ucrt-x86_64-cppunit
            mingw-w64-ucrt-x86_64-readline
            git
            base-devel
            zip
            python

      - name: Build Prisma VST3 from pinned Surge XT source
        shell: pwsh
        run: ./tools/build_prisma_windows.ps1

      - name: Verify Prisma bundle before compiling Phaedra
        run: bash tools/check_prisma_payload.sh vendor/prisma

      - name: Configure
        run: |
          python waf configure \
            --with-backends=portaudio,dummy \
            --no-phone-home \
            --no-dr-mingw \
            --dist-target=mingw \
            --optimize \
            --program-name=Phaedra

      - name: Build
        run: python waf build -j4

      - name: Package Portable
        run: bash make_portable.sh

      - name: Update version in portable
        run: |
          VERSION="$(tr -d '\r\n' < phaedra_updater/version.txt)"
          echo "$VERSION" > Phaedra-Portable/version.txt

      - name: Create ZIP
        run: |
          VERSION="$(tr -d '\r\n' < phaedra_updater/version.txt)"
          cd Phaedra-Portable && zip -r "../Phaedra-v${VERSION}.zip" . && cd ..

      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content -Raw phaedra_updater/version.txt).Trim()
          $iscc = Get-ChildItem -Path ${env:ProgramFiles(x86)} -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw 'ISCC.exe not found' }
          & $iscc "/DAppVersion=$version" Phaedra.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phaedra-windows-preview
          path: |
            Phaedra-v*.zip
            Phaedra-Instalador-Windows-x64.exe
          retention-days: 2