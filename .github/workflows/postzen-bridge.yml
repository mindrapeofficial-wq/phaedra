name: PostZen Instagram Bridge

on:
  pull_request:
    paths:
      - 'tools/postzen/**'
      - '.github/workflows/postzen-bridge.yml'
  push:
    branches:
      - 'feature/instagram-agent-skills-20261031'
    paths:
      - 'tools/postzen/**'
      - '.github/workflows/postzen-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test PostZen bridge (mocked API, no credentials)
        run: |
          node --version
          npm test
        working-directory: tools/postzen
